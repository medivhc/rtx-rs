[package]
name = "rtx-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is intentionally excluded from the main workspace: it pulls
# `libfuzzer-sys` (nightly-only, sanitizer-instrumented) and must never be
# built by an ordinary `cargo test --workspace`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rtx-crypto]
path = "../crates/rtx-crypto"

[dependencies.rtx-dtls]
path = "../crates/rtx-dtls"

[dependencies.rtx-rtcp]
path = "../crates/rtx-rtcp"

[dependencies.rtx-rtp]
path = "../crates/rtx-rtp"

[dependencies.rtx-stun]
path = "../crates/rtx-stun"

[dependencies.rtx-wire]
path = "../crates/rtx-wire"

# Same lint budget as the main workspace.
[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "crypto_aead"
path = "fuzz_targets/crypto_aead.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stun_message"
path = "fuzz_targets/stun_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_header"
path = "fuzz_targets/rtp_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtcp_compound"
path = "fuzz_targets/rtcp_compound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dtls_record"
path = "fuzz_targets/dtls_record.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1