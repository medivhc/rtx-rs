[workspace]
resolver = "2"
members = [
    "crates/rtx-core",
    "crates/rtx-buffer",
    "crates/rtx-wire",
    "crates/rtx-crypto",
    "crates/rtx-crypto-rustcrypto",
    "crates/rtx-rtp",
    "crates/rtx-rtcp",
    "crates/rtx-stun",
    "crates/rtx-ice",
    "crates/rtx-dtls",
    "crates/rtx-srtp",
    "crates/rtx-quic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/medivhc/rtx-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
